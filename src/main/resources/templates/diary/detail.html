<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${diary.title}">일기 상세 보기</title>
    <!-- 💡 Pico CSS CDN 링크 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        /* 와이어프레임의 'Body' 상자 느낌을 내기 위한 본문 박스 여백 설정 */
        .diary-body {
            min-height: 200px;
            padding: 1.5rem;
            background-color: var(--pico-card-background-color);
            border-radius: var(--pico-border-radius);
            white-space: pre-wrap; /* 줄바꿈(엔터)이 화면에 그대로 표시되도록 설정 */
        }
        /* 추가: 이미지 가운데 정렬 및 크기 제한용 클래스 */
        .diary-image-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .diary-image-container img {
            max-width: 100%;
            height: auto;
            border-radius: var(--pico-border-radius);
        }
    </style>
</head>
<body>
<main class="container">

    <!-- 1. 일기 제목과 기분 ({Title}, {Mood}) -->
    <hgroup>
        <h1 th:text="${diary.title}">일기 제목 예시</h1>
        <p>오늘의 기분: <strong th:text="${diary.mood}">HAPPY</strong></p>
    </hgroup>

    <!-- 💡 2. 업로드된 이미지가 있을 때만 사진을 보여주는 영역 추가 -->
    <!-- 백엔드에서 imagePath를 내려주면 렌더링 됩니다. -->
    <div class="diary-image-container" th:if="${diary.imgPath != null}">
        <img th:src="${diary.imgPath}" alt="일기에 첨부된 사진">
    </div>

    <!-- 3. 일기 본문 (Body) - 와이어프레임 중앙 큰 상자 -->
    <article class="diary-body" th:text="${diary.content}">
        오늘 하루는 정말 알차고 즐거웠다! (본문 내용 예시)
    </article>
    <hr>
    <!-- 💡 1. 에러 메시지 처리 (컨트롤러에서 넘어온 ?error=empty_comment 잡기) -->
    <div th:if="${param.error}">
        <p style="color: red; font-weight: bold;">댓글 내용을 입력해주세요!</p>
    </div>

    <!-- 💡 2. 댓글 작성 폼 -->
    <div>
        <h3>댓글 남기기</h3>
        <!-- th:action으로 주소를 만들고, th:object로 아까 컨트롤러에서 넘긴 빈 껍데기(commentRequestDto)를 받습니다 -->
        <form th:action="@{|/diaries/${diary.id}/comments|}" th:object="${commentRequestDto}" method="post">
            <!-- th:field="*{content}" 가 DTO의 content 필드와 이 텍스트박스를 완벽하게 연결해 줍니다 -->
            <textarea th:field="*{content}" placeholder="댓글을 남겨보세요!" rows="3" cols="50"></textarea>
            <button type="submit">등록</button>
        </form>
    </div>

    <br>

    <!-- 💡 3. 댓글 목록 출력 영역 -->
    <div>
        <h3>댓글 목록</h3>

        <!-- 댓글이 하나도 없을 때 보여줄 문구 -->
        <div th:if="${#lists.isEmpty(comments)}">
            <p>아직 작성된 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>
        </div>

        <!-- 댓글이 있을 때 반복문(th:each)으로 출력 -->
        <ul>
            <li th:each="comment : ${comments}" style="margin-bottom: 10px;">

                <!-- 작성자 아이디와 댓글 내용 -->
                <strong th:text="${comment.username}">작성자</strong> :
                <span th:text="${comment.content}">댓글 내용</span>

                <!-- 💡 4. 수정/삭제 버튼 (본인에게만 보이도록 권한 체크!) -->
                <!-- #authentication.name은 현재 로그인한 사용자의 아이디를 뜻합니다 -->
                <div th:if="${#authentication.name == comment.username}" style="display: inline-block; margin-left: 10px;">

                    <!-- 삭제 폼 (POST로 보내지만, hidden input으로 DELETE임을 스프링에게 알림) -->
                    <form th:action="@{|/diaries/${diary.id}/comments/${comment.id}|}" method="post" style="display: inline;">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit">삭제</button>
                    </form>

                    <!-- (참고) 수정 버튼은 보통 자바스크립트를 이용해 이 자리에 새로운 폼을 띄우는 방식으로 구현합니다 -->
                    <button type="button" th:onclick="|toggleEditForm(${comment.id})|">수정</button>
                </div>

            </li>
        </ul>
    </div>

    <!-- 4. 와이어프레임의 하단/우측 이동 버튼들 [목록으로 / 수정 / 삭제] -->
    <div class="grid">
        <!-- 목록으로 돌아가기 -->
        <a th:href="@{/diaries}" role="button" class="secondary outline">⬅️ 목록으로</a>

        <!-- 글 수정 폼(form.html)으로 이동하기 -->
        <a th:href="@{/diaries/{id}/edit(id=${diary.id})}" role="button" class="outline">✏️ 글 수정</a>

        <!-- 글 삭제하기 (실무 Form POST 방식) -->
        <form th:action="@{/diaries/{id}/delete(id=${diary.id})}" th:method="delete" style="margin: 0;">
            <button type="submit"
                    class="contrast"
                    onclick="return confirm('정말 이 일기를 삭제하시겠습니까?');">🗑️ 삭제</button>
        </form>
    </div>

</main>
</body>
</html>
